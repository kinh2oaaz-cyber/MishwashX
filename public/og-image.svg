  <circle cx="930" cy="230" r="330" fill="url(#glow)"/>

  <g opacity="0.85">
    <g fill="none" stroke="url(#strand)" stroke-width="4" stroke-linecap="round" transform="translate(880 120)">
      <path d="M0 24c120 42 120 104 0 146s-120 104 0 146" />
      <path d="M132 24c-120 42-120 104 0 146s120 104 0 146" />
    </g>
    <g stroke="#7FE3D4" stroke-width="2" stroke-linecap="round" opacity="0.5" transform="translate(880 120)">
      <path d="M20 58h92M8 104h116M8 212h116M20 258h92M8 160h116"/>
    </g>
  </g>

  <g transform="translate(88 96)">
    <rect width="34" height="4" rx="2" fill="#24C6B1"/>
    <text x="52" y="5" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="16" letter-spacing="4.2" fill="#7FE3D4" font-weight="600">
