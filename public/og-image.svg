    <text x="88" y="342" font-size="74" font-weight="300" letter-spacing="-2.4" fill="#7FE3D4">to cancer diagnostics.</text>
    <text x="88" y="410" font-size="22" font-weight="400" fill="#ffffff" fill-opacity="0.55" letter-spacing="0.2">
